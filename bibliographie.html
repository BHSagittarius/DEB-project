<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carnet de projet — Bibliographie</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 4h8" stroke="#D9A441" stroke-width="2.2" stroke-linecap="round"/>
      <path d="M17.5 5v9.5L9 31c-1.4 2.6.5 5.5 3.4 5.5h15.2c2.9 0 4.8-2.9 3.4-5.5l-8.5-16.5V5" stroke="#EFE9D8" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M11.5 26h17" stroke="#D9A441" stroke-width="2"/>
    </svg>
    <div class="brand-text">Carnet de<br>projet</div>
  </div>
  <nav class="mainnav">
    <a href="index.html">Tableau de bord</a>
    <a href="taches.html">Tâches</a>
    <a href="bibliographie.html" class="active">Bibliographie</a>
    <a href="notes.html">Méthodes &amp; rapports</a>
  </nav>
  <div class="sidebar-foot">
    <div class="who" id="whoBox"></div>
  </div>
</aside>

<main class="content">
  <div class="page-head">
    <span class="eyebrow">Sources</span>
    <h1>Bibliographie</h1>
    <p class="sub">Articles, protocoles et références utiles au projet.</p>
  </div>

  <div class="card">
    <form class="inline" id="biblioForm">
      <input type="text" id="bTitle" placeholder="Titre de l'article/ouvrage" required style="flex-basis:100%;">
      <select id="bType">
        <option value="Article">Article</option>
        <option value="Protocole">Protocole</option>
        <option value="Livre">Livre</option>
        <option value="Site web">Site web</option>
        <option value="Autre">Autre</option>
      </select>
      <select id="bStatus">
        <option value="a-lire">À lire</option>
        <option value="en-cours">En cours</option>
        <option value="lu">Lu</option>
      </select>
      <input type="text" id="bAuthors" placeholder="Auteurs">
      <input type="text" id="bYear" placeholder="Année" style="max-width:90px;">
      <input type="text" id="bLink" placeholder="Lien (DOI/URL)">
      <input type="text" id="bTags" placeholder="Tags (séparés par des virgules)">
      <textarea id="bNotes" placeholder="Notes / résumé rapide…"></textarea>
      <textarea id="bSynthese" placeholder="Synthèse — ce que j'en retiens pour ma problématique…"></textarea>
      <button type="submit">Ajouter la référence</button>
    </form>
    <div class="biblio-filters" id="biblioFilters"></div>
    <div id="biblioList"><div class="empty">Chargement…</div></div>
  </div>
</main>

<script src="app.js"></script>
<script src="bibliographie.js"></script>
</body>
</html>
